<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keys Breaker</title>
    <meta
      name="description"
      content="Keys Breaker is a tiny browser arcade: four bright rounds, three laps, one thumb."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1 class="visually-hidden">Keys Breaker</h1>
    <nav aria-label="Sound">
      <button type="button" id="mute" aria-label="Sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor" />
          <path
            d="M16 8.5a4 4 0 0 1 0 7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </nav>
    <canvas id="stage" aria-label="Keys Breaker"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
